<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0908" />
    <script>
      // Runs before first paint: a stored choice wins, otherwise follow the OS.
      (function () {
        try {
          var t = localStorage.getItem('hsc-theme')
          if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = t
          if (t === 'light') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f3ed')
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <meta
      name="description"
      content="The Harrogate Sauna Co build ten western red cedar saunas a year, by hand, at Crag Lane in Harrogate. British Columbian cedar kiln dried to 12%, geofenced pre-heat, 20-year cedar warranty. From £24,500."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..600;1,6..72,200..500&family=Archivo:wght@300..600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- MVP demo link. The page still carries placeholder company details and
         the reserve form has no backend, so keep it out of search results
         until both are real. Remove this line to go properly live. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>The Harrogate Sauna Co — Hand-built cedar saunas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
